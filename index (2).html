<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuildWeb Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0d1117] text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken, 
      onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const { useState, useEffect, useRef } = React;

    // --- Target B SVG Logo ---
    const TargetLogo = ({ className = "w-7 h-7", color = "currentColor" }) => (
      <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="36" stroke={color} strokeWidth="6" />
        <line x1="50" y1="5" x2="50" y2="22" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <line x1="50" y1="78" x2="50" y2="95" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <line x1="5" y1="50" x2="22" y2="50" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <line x1="78" y1="50" x2="95" y2="50" stroke={color} strokeWidth="6" strokeLinecap="round" />
        <text x="50" y="63" fontSize="42" fontWeight="900" fill={color} textAnchor="middle" fontFamily="sans-serif">B</text>
      </svg>
    );

    // --- Inline Icon Components ---
    const IconPlus = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const IconSearch = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const IconBell = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
    const IconSun = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    const IconMoon = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
    const IconShield = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
    const IconThumbsUp = () => <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>;
    const IconExternalLink = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;
    const IconMessageSquare = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const IconLogIn = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>;
    const IconLogOut = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
    const IconSend = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
    const IconX = () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    const IconLock = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    const IconUser = () => <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const IconActivity = () => <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
    const IconGithub = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>;
    const IconUserPlus = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>;

    const IconGoogle = () => (
      <svg className="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3h3.88c2.27-2.09 3.665-5.17 3.665-9.12z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.1 0-5.74-2.09-6.68-4.91H1.28v3.09C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.32 14.34c-.24-.72-.38-1.49-.38-2.34s.14-1.62.38-2.34V6.57H1.28v3.09c-.47 1.78-.72 3.56-.72 5.43s.25 3.65.72 5.43l4.04-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.28 6.57l4.04 3.09c.94-2.82 3.58-4.91 6.68-4.91z"/>
      </svg>
    );

    // --- Firebase Setup ---
    const firebaseConfig = typeof __firebase_config !== 'undefined'
      ? JSON.parse(__firebase_config)
      : {
          apiKey: "demo-api-key",
          authDomain: "demo.firebaseapp.com",
          projectId: "demo-project",
          storageBucket: "demo.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:demo"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'buildweb-platform';

    function App() {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('explore');
      const [exploreFilter, setExploreFilter] = useState('Popular');
      
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [language, setLanguage] = useState('ko');

      const [showSearchModal, setShowSearchModal] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [showNotifModal, setShowNotifModal] = useState(false);
      const [notifications] = useState([
        { id: 1, title: 'BuildWeb 플랫폼에 오신 것을 환영합니다!', time: '방금 전', unread: true },
        { id: 2, title: '실시간 빌더 대화방이 열려있습니다.', time: '10분 전', unread: true },
        { id: 3, title: '장현 님이 새 사이드 프로젝트를 등록했습니다.', time: '1시간 전', unread: false }
      ]);

      const [projects, setProjects] = useState([]);
      const [communityPosts, setCommunityPosts] = useState([]);
      const [buildersList, setBuildersList] = useState([]);
      const [chatMessages, setChatMessages] = useState([]);
      const [newMessageText, setNewMessageText] = useState('');
      const [visitCount, setVisitCount] = useState(1);
      const chatEndRef = useRef(null);

      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [adminError, setAdminError] = useState('');

      const [isUserLoggedIn, setIsUserLoggedIn] = useState(false);
      const [userEmail, setUserEmail] = useState('');
      const [userName, setUserName] = useState('게스트 빌더');
      const [userBio, setUserBio] = useState('BuildWeb에서 새로운 사이드 프로젝트를 만들어가는 빌더입니다.');
      const [loginMethod, setLoginMethod] = useState('');

      // 로그인 모달 및 구글 계정 선택 상태
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginStep, setLoginStep] = useState('select'); // 'select', 'google', 'github', 'email'
      const [googleLoginMode, setGoogleLoginMode] = useState('list'); // 'list' | 'custom'
      const [googleCustomEmail, setGoogleCustomEmail] = useState('');
      const [googleCustomName, setGoogleCustomName] = useState('');
      const [customEmail, setCustomEmail] = useState('');
      const [githubUser, setGithubUser] = useState('');

      // 사전 정의된 선택 가능한 구글 계정 목록
      const sampleGoogleAccounts = [
        { name: '장현', email: '1123janghyun2@gmail.com', avatarColor: 'bg-[#5c4033] text-amber-200', initial: '현' },
        { name: '장현 (개발자)', email: 'janghyun.dev@gmail.com', avatarColor: 'bg-blue-900 text-blue-200', initial: 'J' },
        { name: 'BuildWeb Official', email: 'official.buildweb@gmail.com', avatarColor: 'bg-purple-900 text-purple-200', initial: 'B' }
      ];

      const [wizardStep, setWizardStep] = useState(1);
      const [newProjectData, setNewProjectData] = useState({
        title: '',
        tagline: '',
        description: '',
        logoUrl: '',
        gradient: 'from-blue-600 to-indigo-600',
        tags: ['AI', 'Productivity'],
        stage: 'Public',
        helpNeeded: [],
        websiteUrl: '',
        demoUrl: '',
        githubUrl: '',
        discordUrl: ''
      });

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Auth init error:", err);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (usr) => {
          setUser(usr);
          if (usr) {
            const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'visitors');
            setDoc(statsRef, { count: (visitCount || 0) + 1, lastVisited: new Date().toISOString() }, { merge: true });
          }
        });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        const unsubProjects = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), (snapshot) => {
          setProjects(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubPosts = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'community'), (snapshot) => {
          setCommunityPosts(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubBuilders = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'builders'), (snapshot) => {
          setBuildersList(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });

        const unsubChat = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), (snapshot) => {
          const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          list.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
          setChatMessages(list);
        });

        const unsubStats = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'visitors'), (docSnap) => {
          if (docSnap.exists()) {
            setVisitCount(docSnap.data().count || 1);
          }
        });

        return () => {
          unsubProjects();
          unsubPosts();
          unsubBuilders();
          unsubChat();
          unsubStats();
        };
      }, [user]);

      useEffect(() => {
        if (activeTab === 'chat') {
          chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, activeTab]);

      useEffect(() => {
        if (user && isUserLoggedIn) {
          setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'builders', user.uid), {
            uid: user.uid,
            name: userName,
            email: userEmail,
            bio: userBio,
            provider: loginMethod,
            joinedAt: new Date().toLocaleDateString(),
            role: 'Verified Web Builder'
          }, { merge: true });
        }
      }, [user, isUserLoggedIn, userName, userEmail, userBio, loginMethod]);

      // 구글 계정 선택 완료 처리
      const handlePerformGoogleLogin = (email, name) => {
        const finalName = name || email.split('@')[0] || 'Google User';
        setUserName(finalName);
        setUserEmail(email);
        setIsUserLoggedIn(true);
        setLoginMethod('google');
        setShowLoginModal(false);
        setLoginStep('select');
        setGoogleLoginMode('list');
      };

      // 구글 사용자 직접 입력 완료 처리
      const handleGoogleCustomLoginSubmit = (e) => {
        e.preventDefault();
        if (!googleCustomEmail) return;
        handlePerformGoogleLogin(googleCustomEmail, googleCustomName);
      };

      const handlePerformGithubLogin = () => {
        const handleName = githubUser || 'JangHyun';
        setUserName(handleName);
        setUserEmail(`${handleName.toLowerCase()}@github.com`);
        setIsUserLoggedIn(true);
        setLoginMethod('github');
        setShowLoginModal(false);
        setLoginStep('select');
      };

      const handlePerformEmailLogin = (e) => {
        e.preventDefault();
        if (!customEmail) return;
        const derivedName = customEmail.split('@')[0] || 'Builder';
        setUserName(derivedName);
        setUserEmail(customEmail);
        setIsUserLoggedIn(true);
        setLoginMethod('email');
        setShowLoginModal(false);
        setLoginStep('select');
      };

      const handleLogout = () => {
        setIsUserLoggedIn(false);
        setUserName('게스트 빌더');
        setUserEmail('');
        setLoginMethod('');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPasswordInput === 'janghyun1123!!') {
          setIsAdminLoggedIn(true);
          setAdminError('');
        } else {
          setAdminError(language === 'ko' ? '비밀번호가 올바르지 않습니다.' : 'Incorrect password.');
        }
      };

      const handleCreateProject = async () => {
        if (!user) return;
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), {
            ...newProjectData,
            authorId: user.uid,
            authorName: userName,
            authorEmail: userEmail,
            likes: 0,
            createdAt: new Date().toISOString()
          });

          setWizardStep(1);
          setNewProjectData({
            title: '',
            tagline: '',
            description: '',
            logoUrl: '',
            gradient: 'from-blue-600 to-indigo-600',
            tags: ['AI', 'Productivity'],
            stage: 'Public',
            helpNeeded: [],
            websiteUrl: '',
            demoUrl: '',
            githubUrl: '',
            discordUrl: ''
          });
          setActiveTab('explore');
        } catch (err) {
          console.error("Project add error:", err);
        }
      };

      const handleLikeProject = async (projId, currentLikes) => {
        if (!user) return;
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projId), {
            likes: (currentLikes || 0) + 1
          });
        } catch (err) {
          console.error("Like error:", err);
        }
      };

      const handleDeleteProject = async (projId) => {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projId));
        } catch (err) {
          console.error("Delete error:", err);
        }
      };

      const handleSendChatMessage = async (e) => {
        e.preventDefault();
        if (!user || !newMessageText.trim()) return;

        if (!isUserLoggedIn) {
          setShowLoginModal(true);
          setLoginStep('select');
          return;
        }

        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), {
            text: newMessageText,
            authorName: userName,
            authorEmail: userEmail,
            authorId: user.uid,
            createdAt: new Date().toISOString()
          });
          setNewMessageText('');
        } catch (err) {
          console.error("Chat send error:", err);
        }
      };

      const gradientOptions = [
        'from-blue-600 to-indigo-600',
        'from-purple-600 to-pink-600',
        'from-emerald-500 to-teal-700',
        'from-amber-500 to-red-600',
        'from-cyan-500 to-blue-600',
        'from-rose-500 to-purple-600'
      ];

      const filteredProjects = projects.filter(p => 
        p.title?.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.tagline?.toLowerCase().includes(searchQuery.toLowerCase()) ||
        p.authorName?.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const bgClass = isDarkMode ? "bg-[#0d1117] text-gray-100" : "bg-slate-50 text-gray-900";
      const navBgClass = isDarkMode ? "bg-[#161b22]/90 border-gray-800 text-gray-100" : "bg-white/90 border-slate-200 text-gray-800 shadow-sm";
      const cardBgClass = isDarkMode ? "bg-[#161b22] border-gray-800" : "bg-white border-slate-200 shadow-sm";
      const borderClass = isDarkMode ? "border-gray-800" : "border-slate-200";

      return (
        <div className={`min-h-screen ${bgClass} font-sans flex flex-col transition-colors duration-200`}>
          {/* Top Header */}
          <header className={`sticky top-0 z-40 backdrop-blur-md border-b px-4 lg:px-8 py-3 flex items-center justify-between ${navBgClass}`}>
            <div className="flex items-center space-x-6 lg:space-x-8">
              <div 
                onClick={() => setActiveTab('explore')}
                className="flex items-center space-x-2.5 cursor-pointer group"
              >
                <div className={`p-1 rounded-xl transition-transform group-hover:scale-105 ${isDarkMode ? 'bg-gray-800 text-blue-400' : 'bg-blue-50 text-blue-600'}`}>
                  <TargetLogo className="w-7 h-7" />
                </div>
                <span className="text-xl font-black tracking-tight group-hover:text-blue-500 transition-colors">
                  BuildWeb
                </span>
              </div>

              <nav className="hidden md:flex items-center space-x-1">
                <button
                  onClick={() => setActiveTab('explore')}
                  className={`px-3 py-1.5 rounded-md text-sm font-semibold transition-colors ${
                    activeTab === 'explore' ? (isDarkMode ? 'bg-gray-800 text-white' : 'bg-slate-200 text-black') : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  Explore
                </button>

                <button
                  onClick={() => {
                    if (!isUserLoggedIn) { setShowLoginModal(true); setLoginStep('select'); }
                    else { setActiveTab('my-activity'); }
                  }}
                  className={`px-3 py-1.5 rounded-md text-sm font-semibold transition-colors ${
                    activeTab === 'my-activity' ? (isDarkMode ? 'bg-gray-800 text-white' : 'bg-slate-200 text-black') : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  My Activity
                </button>

                <button

                        value={userName} 
                        onChange={(e) => setUserName(e.target.value)}
                        className="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-400">한줄 소개</label>
                      <textarea 
                        rows="3" 
                        value={userBio} 
                        onChange={(e) => setUserBio(e.target.value)}
                        className="w-full mt-1 bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 7: NEW PROJECT WIZARD */}
            {activeTab === 'new-project' && (
              <div className="max-w-2xl mx-auto py-4 space-y-6">
                <div className="text-center space-y-1">
                  <h1 className="text-2xl font-extrabold text-white">New Project</h1>
                  <p className="text-xs text-gray-400">프로젝트와 커스텀 로고를 등록하세요.</p>
                </div>

                <div className="flex items-center justify-center space-x-2 sm:space-x-4 py-2">
                  {[
                    { step: 1, name: 'Basics' },
                    { step: 2, name: 'Logo' },
                    { step: 3, name: 'Cover' },
                    { step: 4, name: 'Tags' },
                    { step: 5, name: 'Stage' },
                    { step: 6, name: 'Links' }
                  ].map((s) => (
                    <div key={s.step} className="flex items-center space-x-1.5">
                      <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                        wizardStep === s.step ? 'bg-blue-600 text-white' : wizardStep > s.step ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-500'
                      }`}>
                        {s.step}
                      </div>
                      <span className="hidden sm:inline text-xs text-gray-400">{s.name}</span>
                    </div>
                  ))}
                </div>

                <div className={`${cardBgClass} border ${borderClass} rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl`}>
                  {wizardStep === 1 && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">1. 프로젝트 기본 정보</h3>
                      <div>
                        <label className="text-xs font-semibold text-gray-300">프로젝트 이름 *</label>
                        <input 
                          type="text"
                          placeholder="예: BuildWeb Target System"
                          value={newProjectData.title}
                          onChange={(e) => setNewProjectData({...newProjectData, title: e.target.value})}
                          className="w-full mt-1.5 bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-gray-300">한줄 소개 *</label>
                        <input 
                          type="text"
                          placeholder="프로젝트 가치를 짧게 적어주세요."
                          maxLength={80}
                          value={newProjectData.tagline}
                          onChange={(e) => setNewProjectData({...newProjectData, tagline: e.target.value})}
                          className="w-full mt-1.5 bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500"
                        />
                      </div>
                    </div>
                  )}

                  {wizardStep === 2 && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">2. 프로젝트 로고 설정</h3>
                      <input 
                        type="text"
                        placeholder="https://example.com/logo.png"
                        value={newProjectData.logoUrl}
                        onChange={(e) => setNewProjectData({...newProjectData, logoUrl: e.target.value})}
                        className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white outline-none focus:border-blue-500"
                      />
                      <div className="p-4 bg-gray-900/60 rounded-xl border border-gray-800 flex items-center space-x-4">
                        <div className="w-12 h-12 rounded-xl bg-gray-800 p-2 border border-gray-700 flex items-center justify-center overflow-hidden">
                          {newProjectData.logoUrl ? <img src={newProjectData.logoUrl} alt="Preview" className="w-full h-full object-cover rounded-lg" /> : <TargetLogo className="w-8 h-8 text-blue-400" />}
                        </div>
                        <div className="text-xs text-gray-400">로고 미리보기</div>
                      </div>
                    </div>
                  )}

                  {wizardStep === 3 && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">3. 배경 그라데이션 선택</h3>
                      <div className="grid grid-cols-3 gap-3">
                        {gradientOptions.map((grad) => (
                          <div
                            key={grad}
                            onClick={() => setNewProjectData({...newProjectData, gradient: grad})}
                            className={`h-16 rounded-xl bg-gradient-to-r ${grad} cursor-pointer border-2 ${newProjectData.gradient === grad ? 'border-white' : 'border-transparent'}`}
                          />
                        ))}
                      </div>
                    </div>
                  )}

                  {wizardStep === 4 && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">4. 태그 선택</h3>
                      <div className="flex flex-wrap gap-2">
                        {['SaaS', 'AI', 'Education', 'Game', 'Finance', 'Productivity'].map((tag) => (
                          <button
                            key={tag}
                            type="button"
                            onClick={() => setNewProjectData({...newProjectData, tags: [tag]})}
                            className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${newProjectData.tags.includes(tag) ? 'bg-blue-600 border-blue-500 text-white' : 'bg-gray-900 border-gray-700 text-gray-400'}`}
                          >
                            #{tag}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {wizardStep === 5 && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">5. 진행 단계 선택</h3>
                      <div className="grid grid-cols-2 gap-3">
                        {['Idea', 'Building', 'Beta', 'Public'].map((stage) => (
                          <div
                            key={stage}
                            onClick={() => setNewProjectData({...newProjectData, stage})}
                            className={`p-4 rounded-xl border cursor-pointer ${newProjectData.stage === stage ? 'bg-blue-950 border-blue-500 text-white' : 'bg-gray-900 border-gray-800 text-gray-400'}`}
                          >
                            <h4 className="font-bold text-sm text-white">{stage}</h4>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {wizardStep === 6 && (
                    <div className="space-y-4">
                      <h3 className="text-lg font-bold text-white">6. 웹사이트 및 링크</h3>
                      <input 
                        type="text" 
                        placeholder="https://yourproject.com"
                        value={newProjectData.websiteUrl}
                        onChange={(e) => setNewProjectData({...newProjectData, websiteUrl: e.target.value})}
                        className="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>
                  )}

                  <div className="flex items-center justify-between pt-4 border-t border-gray-800">
                    {wizardStep > 1 ? (
                      <button type="button" onClick={() => setWizardStep(wizardStep - 1)} className="px-4 py-2 rounded-xl bg-gray-800 text-xs text-gray-300">이전</button>
                    ) : <div />}

                    {wizardStep < 6 ? (
                      <button type="button" onClick={() => setWizardStep(wizardStep + 1)} className="px-5 py-2.5 rounded-xl bg-blue-600 text-xs font-semibold text-white">다음</button>
                    ) : (
                      <button type="button" onClick={handleCreateProject} className="px-6 py-2.5 rounded-xl bg-blue-600 text-xs font-bold text-white">등록 완료</button>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 8: ADMIN PANEL */}
            {activeTab === 'admin' && (
              <div className="max-w-4xl mx-auto space-y-6">
                {!isAdminLoggedIn ? (
                  <div className={`max-w-md mx-auto ${cardBgClass} border ${borderClass} rounded-2xl p-6 sm:p-8 space-y-4 text-center shadow-2xl`}>
                    <div className="w-12 h-12 rounded-full bg-purple-950 border border-purple-500/40 text-purple-400 flex items-center justify-center mx-auto">
                      <IconLock />
                    </div>
                    <h2 className="text-xl font-bold text-white">관리자 권한 인증</h2>

                    <form onSubmit={handleAdminLogin} className="space-y-3 pt-2">
                      <input 
                        type="password"
                        placeholder="비밀번호..."
                        value={adminPasswordInput}
                        onChange={(e) => setAdminPasswordInput(e.target.value)}
                        className="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-xs text-white outline-none focus:border-purple-500 text-center"
                      />
                      {adminError && <p className="text-xs text-red-400">{adminError}</p>}
                      <button type="submit" className="w-full bg-purple-600 text-white font-bold py-2.5 rounded-xl text-xs">관리자 로그인</button>
                    </form>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between border-b border-gray-800 pb-4">
                      <h2 className="text-2xl font-black text-white">BuildWeb Master Admin</h2>
                      <button onClick={() => setIsAdminLoggedIn(false)} className="bg-gray-800 text-gray-300 px-3 py-1.5 rounded-lg text-xs">로그아웃</button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      <div className="bg-[#161b22] border border-gray-800 p-4 rounded-xl">
                        <div className="text-gray-400 text-xs font-medium">총 방문자 수</div>
                        <div className="text-2xl font-black text-white mt-2">{visitCount}</div>
                      </div>
                      <div className="bg-[#161b22] border border-gray-800 p-4 rounded-xl">
                        <div className="text-gray-400 text-xs font-medium">가입자 수</div>
                        <div className="text-2xl font-black text-white mt-2">{buildersList.length}</div>
                      </div>
                      <div className="bg-[#161b22] border border-gray-800 p-4 rounded-xl">
                        <div className="text-gray-400 text-xs font-medium">프로젝트 수</div>
                        <div className="text-2xl font-black text-white mt-2">{projects.length}</div>
                      </div>
                      <div className="bg-[#161b22] border border-gray-800 p-4 rounded-xl">
                        <div className="text-gray-400 text-xs font-medium">실시간 메시지 수</div>
                        <div className="text-2xl font-black text-white mt-2">{chatMessages.length}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              {loginStep === 'select' && (
                <div className="bg-[#0d1117] border border-gray-800 rounded-3xl w-full max-w-md p-8 relative space-y-6 text-center shadow-2xl">
                  <button onClick={() => setShowLoginModal(false)} className="absolute top-5 right-5 text-gray-400 hover:text-white"><IconX /></button>

                  <div className="w-12 h-12 bg-[#1c2128] border border-gray-700/80 rounded-2xl flex items-center justify-center mx-auto">
                    <TargetLogo className="w-8 h-8 text-blue-400" />
                  </div>

                  <h2 className="text-2xl font-extrabold text-white">Log in</h2>

                  <div className="space-y-3 pt-2">
                    <button 
                      onClick={() => { setLoginStep('google'); setGoogleLoginMode('list'); }} 
                      className="w-full bg-[#161b22] hover:bg-gray-800 border border-gray-700 text-white py-2.5 px-4 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2.5 transition-colors"
                    >
                      <IconGoogle />
                      <span>Continue with Google</span>
                    </button>
                    <button onClick={() => setLoginStep('github')} className="w-full bg-[#161b22] hover:bg-gray-800 border border-gray-700 text-white py-2.5 px-4 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition-colors">
                      <IconGithub />
                      <span>Continue with GitHub</span>
                    </button>
                    <button onClick={() => setLoginStep('email')} className="w-full bg-gray-900 text-gray-400 hover:text-white py-2 rounded-xl text-xs transition-colors">
                      이메일 주소로 로그인
                    </button>
                  </div>
                </div>
              )}

              {/* 구글 로그인 계정 선택 팝업 UI */}
              {loginStep === 'google' && (
                <div className="bg-[#121212] border border-gray-800 rounded-3xl w-full max-w-lg p-8 relative space-y-6 shadow-2xl">
                  <button onClick={() => setLoginStep('select')} className="absolute top-5 right-5 text-gray-400 hover:text-white"><IconX /></button>

                  <div className="flex items-center space-x-2">
                    <IconGoogle />
                    <span className="text-sm font-bold text-gray-300">Google 계정으로 로그인</span>
                  </div>

                  <div className="space-y-1">
                    <h3 className="text-2xl font-black text-white">계정을 선택하세요.</h3>
                    <p className="text-xs text-blue-400 font-medium">BuildWeb(으)로 이동</p>
                  </div>

                  {googleLoginMode === 'list' ? (
                    <div className="space-y-3 pt-2">
                      {/* 사전에 등록된 구글 계정 옵션들 */}
                      {sampleGoogleAccounts.map((acc, idx) => (
                        <div 
                          key={idx}
                          onClick={() => handlePerformGoogleLogin(acc.email, acc.name)}
                          className="flex items-center space-x-4 p-3.5 rounded-2xl hover:bg-gray-800/80 cursor-pointer border border-gray-800/80 transition-all hover:border-gray-700"
                        >
                          <div className={`w-10 h-10 rounded-full ${acc.avatarColor} flex items-center justify-center font-bold text-sm shadow`}>
                            {acc.initial}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-bold text-white truncate">{acc.name}</div>
                            <div className="text-xs text-gray-400 truncate">{acc.email}</div>
                          </div>
                        </div>
                      ))}

                      {/* 다른 계정 사용 버튼 */}
                      <div 
                        onClick={() => setGoogleLoginMode('custom')}
                        className="flex items-center space-x-4 p-3.5 rounded-2xl hover:bg-gray-800/80 cursor-pointer border border-dashed border-gray-700 transition-all"
                      >
                        <div className="w-10 h-10 rounded-full bg-gray-800 text-gray-300 flex items-center justify-center">
                          <IconUserPlus />
                        </div>
                        <div className="flex-1">
                          <div className="text-sm font-bold text-white">다른 계정 사용</div>
                          <div className="text-xs text-gray-400">원하는 구글 이메일로 직접 로그인</div>
                        </div>
                      </div>
                    </div>
                  ) : (
                    /* 원하는 구글 계정 직접 입력 폼 */
                    <form onSubmit={handleGoogleCustomLoginSubmit} className="space-y-4 pt-2">
                      <div>
                        <label className="text-xs font-semibold text-gray-400">Google 이메일 주소</label>
                        <input 
                          type="email" 
                          required
                          placeholder="your.email@gmail.com" 
                          value={googleCustomEmail}
                          onChange={(e) => setGoogleCustomEmail(e.target.value)}
                          className="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-gray-400">이름 / 닉네임</label>
                        <input 
                          type="text" 
                          placeholder="예: 홍길동" 
                          value={googleCustomName}
                          onChange={(e) => setGoogleCustomName(e.target.value)}
                          className="w-full mt-1 bg-gray-900 border border-gray-700 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500"
                        />
                      </div>
                      <div className="flex space-x-2 pt-2">
                        <button 
                          type="button" 
                          onClick={() => setGoogleLoginMode('list')}
                          className="w-1/3 bg-gray-800 text-gray-300 font-bold py-2.5 rounded-xl text-xs hover:bg-gray-700"
                        >
                          목록으로
                        </button>
                        <button 
                          type="submit" 
                          className="w-2/3 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-blue-500"
                        >
                          이 계정으로 로그인
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              )}

              {loginStep === 'github' && (
                <div className="bg-[#0d1117] border border-gray-800 rounded-3xl w-full max-w-sm p-8 relative space-y-6 text-center shadow-2xl">
                  <button onClick={() => setLoginStep('select')} className="absolute top-5 right-5 text-gray-400 hover:text-white"><IconX /></button>
                  <h3 className="text-lg font-bold text-white">Sign in to GitHub</h3>
                  <input type="text" value={githubUser} onChange={(e) => setGithubUser(e.target.value)} placeholder="Username or Email" className="w-full bg-[#010409] border border-gray-700 rounded-lg p-2.5 text-xs text-white" />
                  <button onClick={handlePerformGithubLogin} className="w-full bg-[#238636] hover:bg-[#2ea043] text-white font-bold py-2.5 rounded-lg text-xs">Sign in</button>
                </div>
              )}

              {loginStep === 'email' && (
                <div className="bg-[#0d1117] border border-gray-800 rounded-3xl w-full max-w-sm p-6 relative space-y-4 shadow-2xl">
                  <button onClick={() => setLoginStep('select')} className="absolute top-4 right-4 text-gray-400 hover:text-white"><IconX /></button>
                  <h3 className="text-lg font-bold text-white text-center">이메일 로그인</h3>
                  <form onSubmit={handlePerformEmailLogin} className="space-y-3 pt-2">
                    <input type="email" required placeholder="builder@buildweb.com" value={customEmail} onChange={(e) => setCustomEmail(e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-xs text-white" />
                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-xs">로그인 완료</button>
                  </form>
                </div>
              )}
            </div>
          )}

          <footer className="border-t border-gray-800/80 bg-[#161b22]/50 py-6 px-4 text-center text-xs text-gray-500">
            <p>© 2026 BuildWeb Platform. All rights reserved.</p>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
